<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我们的故事</title>
  <link rel="stylesheet" href="memory.css">
</head>
<body>
  <!-- 背景音乐 -->
<audio id="bgMusic" loop preload="auto">
  <source src="music/memory_bg.mp3" type="audio/mpeg">
</audio>

<!-- 音乐控制按钮 -->
<div class="music-toggle" id="musicToggle" onclick="toggleBgMusic()">
  <span id="musicIcon">🎵</span>
</div>

<!-- 音乐引导提示气泡 -->
<div class="music-tip" id="musicTip">
  <span>点这里开启背景音乐</span>
  <div class="music-tip-arrow"></div>
</div>

<!-- 顶部导航 -->
<div class="mem-header">
  <a href="index.html" class="mem-back">‹ 回到首页</a>
  <div class="mem-title">我们的故事</div>
  <div class="mem-subtitle">从 2024 到 2026 · 每一段都值得记住</div>
</div>

<!-- 时间线容器 -->
<div class="timeline" id="timeline">
  <!-- JS 动态渲染 -->
</div>

<!-- 回到顶部 -->
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- 图片放大弹窗 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-prev" onclick="event.stopPropagation(); lightboxPrev()">‹</button>
  <button class="lightbox-next" onclick="event.stopPropagation(); lightboxNext()">›</button>
</div>

<script src="memory.js"></script>
<script>
  /* ===== 背景音乐控制 ===== */
  let bgPlaying = false;
  const bgMusic = document.getElementById('bgMusic');
  const musicToggle = document.getElementById('musicToggle');
  const musicIcon = document.getElementById('musicIcon');
  const musicTip = document.getElementById('musicTip');

  // 首次点击页面任意位置，自动播放
  let bgAutoPlayed = false;
  document.addEventListener('click', function autoPlayBg() {
    if (bgAutoPlayed) return;
    bgAutoPlayed = true;
    startBgMusic();
  }, { once: true });

  function startBgMusic() {
    bgMusic.volume = 0;
    bgMusic.play().then(() => {
      let vol = 0;
      const fade = setInterval(() => {
        vol += 0.05;
        bgMusic.volume = Math.min(vol, 0.35);
        if (vol >= 0.35) clearInterval(fade);
      }, 50);
      bgPlaying = true;
      musicToggle.classList.add('playing');
      musicIcon.textContent = '🎶';
      musicTip.classList.add('hidden');
    }).catch(() => {});
  }

  function toggleBgMusic() {
    if (!bgPlaying) {
      startBgMusic();
    } else {
      let vol = bgMusic.volume;
      const fade = setInterval(() => {
        vol -= 0.05;
        bgMusic.volume = Math.max(vol, 0);
        if (vol <= 0) {
          clearInterval(fade);
          bgMusic.pause();
        }
      }, 50);
      bgPlaying = false;
      musicToggle.classList.remove('playing');
      musicIcon.textContent = '🎵';
    }
  }

  window.addEventListener('beforeunload', () => { bgMusic.pause(); });
</script>
</body>
</html>
