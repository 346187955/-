<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一个惊喜 · 生日礼物待领取券</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
/* 背景音乐提示 */
.music-tip {
  position: fixed;
  top: 70px;
  right: 75px; /* 对齐右上角音乐按钮 */
  background: rgba(201, 169, 110, 0.95);
  color: #1a1a22;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  z-index: 1001;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: tipBounce 1.5s ease-in-out infinite;
  pointer-events: none; /* 不阻挡点击 */
}

.music-tip-arrow {
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 10px solid rgba(201, 169, 110, 0.95);
  margin-top: -6px;
  transform: rotate(180deg); /* 箭头指向右上方按钮 */
}

@keyframes tipBounce {
  0%, 100% { transform: translateY(0); opacity: 0.9; }
  50% { transform: translateY(-6px); opacity: 1; }
}

/* 音乐播放后隐藏提示 */
.music-tip.hidden {
  display: none;
}

/* 移动端微调 */
@media (max-width: 768px) {
  .music-tip {
    top: 60px;
    right: 65px;
    font-size: 12px;
    padding: 6px 10px;
  }
}
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0a0f;
      color: #e8e4dc;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px 20px;
      overflow-x: hidden;
      transition: background 1s;
    }

    /* 顶部 */
    .sur-header {
      position: absolute; top: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 24px;
    }
    .sur-back { color: #c9a96e; text-decoration: none; font-size: 15px; }
    .sur-title { font-size: 18px; letter-spacing: 2px; font-weight: 600; }

    /* ===== 背景音乐控制按钮 ===== */
    .music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(201,169,110,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201,169,110,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .music-toggle:active { transform: scale(0.9); }
    .music-toggle.playing {
      background: rgba(201,169,110,0.3);
      animation: musicPulse 2s ease-in-out infinite;
    }
    @keyframes musicPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(201,169,110,0.2); }
      50% { box-shadow: 0 0 0 8px rgba(201,169,110,0); }
    }
    #musicIcon { font-size: 18px; }
    .music-toggle.playing #musicIcon { animation: spin 4s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .music-toggle { top: 16px; right: 16px; width: 36px; height: 36px; }
      #musicIcon { font-size: 16px; }
    }

    /* 礼盒 */
    .gift-box {
      width: 160px; height: 160px;
      margin-bottom: 40px;
      cursor: pointer;
      position: relative;
      transition: transform 0.4s;
      animation: float 3s ease-in-out infinite;
    }
    .gift-box:active { transform: scale(0.9); }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    .gift-body {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 130px; height: 100px;
      background: linear-gradient(180deg, #c0392b, #8e2a1e);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(192,57,43,0.4);
    }
    .gift-body::after {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 22px; height: 100%; background: #f1c40f;
    }
    .gift-lid {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 150px; height: 30px;
      background: linear-gradient(180deg, #e74c3c, #c0392b);
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .gift-lid::after {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 22px; height: 100%; background: #f1c40f;
    }
    .gift-bow {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      font-size: 40px; z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .gift-hint {
      font-size: 15px; color: rgba(255,255,255,0.5); margin-bottom: 50px;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

    /* 礼券 */
    .coupon {
      width: 100%; max-width: 340px;
      background: linear-gradient(135deg, #3a2a18 0%, #1a1a22 100%);
      border-radius: 20px; padding: 26px;
      border: 2px dashed #c9a96e;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      position: relative;
      display: none;
      animation: couponIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .coupon.show { display: block; }
    @keyframes couponIn { 0%{transform:scale(0.5) rotate(-5deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }

    .coupon::before {
      content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; border-radius: 50%; background: #0a0a0f;
    }
    .coupon::after {
      content: ''; position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; border-radius: 50%; background: #0a0a0f;
    }

    .coupon-badge {
      text-align: center; font-size: 13px; color: #c9a96e; letter-spacing: 3px; margin-bottom: 6px;
    }
    .coupon-title { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .coupon-sub { text-align: center; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px; }

    .coupon-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 15px;
    }
    .coupon-item.clickable { cursor: pointer; transition: background 0.2s; }
    .coupon-item.clickable:hover { background: rgba(255,255,255,0.05); }
    .coupon-item.clickable .txt { color: #ffd9b3; }
    .coupon-item .icon { font-size: 22px; width: 32px; text-align: center; }
    .coupon-item .txt { flex: 1; color: rgba(255,255,255,0.85); }
    .coupon-item .stat { font-size: 13px; color: #c9a96e; }

    /* 蛋糕倒计时 */
    .countdown-box {
      margin: 18px 0 6px; padding: 16px;
      background: rgba(255,255,255,0.04); border-radius: 14px;
      border: 1px solid rgba(201,169,110,0.15); text-align: center;
    }
    .countdown-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
    .countdown-time {
      font-size: 22px; font-weight: 700; letter-spacing: 1px;
      background: linear-gradient(90deg, #c9a96e, #ffb3d1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .coupon-code {
      margin: 18px 0 20px; text-align: center;
      font-family: monospace; font-size: 16px; letter-spacing: 2px;
      color: #c9a96e; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px;
    }

    .claim-btn {
      width: 100%; padding: 14px; border: none; border-radius: 999px;
      background: linear-gradient(90deg, #c9a96e, #e8c98a);
      color: #1a1a22; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: transform 0.2s, opacity 0.3s;
    }
    .claim-btn:active { transform: scale(0.96); }
    .claim-btn.claimed { opacity: 0.5; pointer-events: none; }

    .claim-tip {
      text-align: center; font-size: 12px; color: rgba(255,255,255,0.3);
      margin-top: 14px; min-height: 16px;
    }

    /* 撒花 */
    .confetti {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999; overflow: hidden;
    }
    .confetti-piece {
      position: absolute; top: -20px; width: 10px; height: 16px;
      border-radius: 2px; animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%{transform:translateY(0) rotate(0deg);opacity:1}
      100%{transform:translateY(110vh) rotate(720deg);opacity:0.8}
    }

    /* ===== 礼物图片弹窗 ===== */
    .gift-photo-modal {
      display: none; position: fixed; inset: 0; z-index: 99999;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    }
    .gift-photo-modal.show { display: flex; animation: fadeIn 0.3s; }
    .gift-photo-box {
      position: relative; max-width: 360px; width: 88%;
      background: #1a1a22; border-radius: 20px; overflow: hidden;
      border: 2px solid rgba(201,169,110,0.4);
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
      animation: couponIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .gift-photo-box img {
      width: 100%; display: block; max-height: 60vh; object-fit: contain;
      background: #111; cursor: zoom-in;
    }
    .gift-photo-caption { padding: 16px 20px; text-align: center; }
    .gift-photo-caption .g-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .gift-photo-caption .g-desc { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
    .gift-photo-caption .g-tag {
      display: inline-block; font-size: 12px; color: #c9a96e;
      background: rgba(201,169,110,0.12); padding: 4px 14px; border-radius: 20px;
    }
    .gift-photo-close {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.5); color: #fff; font-size: 18px; cursor: pointer;
    }
    .gift-photo-hint {
      position: fixed; bottom: 24px; left: 0; right: 0;
      text-align: center; font-size: 12px; color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <!-- 背景音乐引导提示 -->
<div class="music-tip" id="musicTip">
  <span>点右上角 🎵 开启背景音乐</span>
  <div class="music-tip-arrow"></div>
</div>
  <!-- 背景音乐 -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music/surprise_bg.mp3" type="audio/mpeg">
  </audio>

  <!-- 顶部 -->
  <div class="sur-header">
    <a href="index.html" class="sur-back">‹ 首页</a>
    <div class="sur-title">一个惊喜</div>
    <div style="width:40px"></div>
  </div>

  <!-- 音乐控制按钮 -->
  <div class="music-toggle" id="musicToggle" onclick="toggleMusic()">
    <span id="musicIcon">🎵</span>
  </div>

  <!-- 礼盒 -->
  <div class="gift-box" id="giftBox" onclick="openGift()">
    <div class="gift-lid"></div>
    <div class="gift-body"></div>
    <div class="gift-bow">🎀</div>
  </div>
  <div class="gift-hint" id="giftHint">点一下礼盒</div>

  <!-- 礼券 -->
  <div class="coupon" id="coupon">
    <div class="coupon-badge">BIRTHDAY · COUPON</div>
    <div class="coupon-title">🎂 生日礼物待领取券</div>
    <div class="coupon-sub">专属 · 不可转让 · 永久有效</div>

    <!-- 迪奥唇蜜（可点图） -->
    <div class="coupon-item clickable" onclick="viewGift(0)">
      <div class="icon">💄</div>
      <div class="txt">迪奥唇蜜 · 玫瑰豆沙</div>
      <div class="stat" id="stat0">👀 点我看</div>
    </div>
    <!-- 10月23日 -->
    <div class="coupon-item">
      <div class="icon">📅</div>
      <div class="txt">10月23日</div>
      <div class="stat" id="stat1">待领取</div>
    </div>
    <!-- 生日蛋糕（可点图 + 点词条播放生日歌） -->
    <div class="coupon-item clickable" onclick="viewGift(1)">
      <div class="icon">🍰</div>
      <div class="txt">一个生日蛋糕</div>
      <div class="stat" id="stat2">👀 点我看</div>
    </div>
    <!-- 一整年的陪伴 -->
    <div class="coupon-item">
      <div class="icon">🌟</div>
      <div class="txt">一整年的专属陪伴</div>
      <div class="stat">永久</div>
    </div>

    <!-- 蛋糕倒计时（10月20日） -->
    <div class="countdown-box">
      <div class="countdown-label">🎂 距蛋糕出场还有</div>
      <div class="countdown-time" id="cakeCountdown">计算中…</div>
    </div>

    <div class="coupon-code" id="couponCode">券码 · 计算中…</div>

    <button class="claim-btn" id="claimBtn" onclick="claimGift()">领取全部礼物</button>
    <div class="claim-tip" id="claimTip">点击领取，即刻生效 💕</div>
  </div>

  <!-- 礼物图片弹窗 -->
  <div class="gift-photo-modal" id="giftPhotoModal" onclick="closeGiftPhoto()">
    <div class="gift-photo-box" onclick="event.stopPropagation()">
      <button class="gift-photo-close" onclick="closeGiftPhoto()">✕</button>
      <img id="giftPhotoImg" src="" alt="礼物">
      <div class="gift-photo-caption">
        <div class="g-name" id="giftPhotoName"></div>
        <div class="g-desc" id="giftPhotoDesc"></div>
        <div class="g-tag" id="giftPhotoTag"></div>
      </div>
    </div>
  </div>
  <div class="gift-photo-hint" id="giftPhotoHint" style="display:none;">点图片放大 · 点空白关闭</div>

  <!-- 生日快乐歌 -->
  <audio id="birthdayAudio" src="audio/happy-birthday.mp3" preload="auto"></audio>

  <div class="confetti" id="confetti"></div>

  <script>
    /* ===== 背景音乐控制 ===== */
    let musicPlaying = false;
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');

    // 首次交互后解锁（浏览器自动播放策略）
    document.addEventListener('click', function unlock() {
      // 仅解锁，不自动播放，等用户主动点按钮
    }, { once: true });

    function toggleMusic() {
      if (!musicPlaying) {
        bgMusic.volume = 0;
        bgMusic.play().then(() => {
          let vol = 0;
          const fadeIn = setInterval(() => {
            vol += 0.05;
            bgMusic.volume = Math.min(vol, 0.4);
            if (vol >= 0.4) clearInterval(fadeIn);
          }, 50);
          musicPlaying = true;
          musicToggle.classList.add('playing');
          musicIcon.textContent = '🎶';
        }).catch(err => {
          console.log('播放被拦截:', err);
        });
      } else {
        let vol = bgMusic.volume;
        const fadeOut = setInterval(() => {
          vol -= 0.05;
          bgMusic.volume = Math.max(vol, 0);
          if (vol <= 0) {
            clearInterval(fadeOut);
            bgMusic.pause();
          }
        }, 50);
        musicPlaying = false;
        musicToggle.classList.remove('playing');
        musicIcon.textContent = '🎵';
      }
    }

    // 页面卸载时暂停
    window.addEventListener('beforeunload', () => { bgMusic.pause(); });

    /* ===== 礼物图片数据 ===== */
    const GIFTS = [
      {
        name: "DIOR 迪奥魅惑丰唇唇蜜",
        desc: "009 玫瑰豆沙 · 水光保湿 · 纯欲嘟嘟唇",
        tag: "已下单",
        img: "img/gift_dior.jpg"
      },
      {
        name: "一个生日蛋糕",
        desc: "🎂 10月20日准时出场",
        tag: "待出场 · 10月20日",
        img: "img/gift_cake.jpg"
      }
    ];

    let zoomed = false;

    /* ===== 蛋糕倒计时（目标：10月20日） ===== */
    function initCakeCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 9, 20, 0, 0, 0);
      if (target.getTime() < now.getTime() - 86400000) {
        target = new Date(targetYear + 1, 9, 20, 0, 0, 0);
      }

      function update() {
        const diff = target.getTime() - new Date().getTime();
        const el = document.getElementById("cakeCountdown");
        if (!el) return;

        if (diff <= 0) {
          el.textContent = "🎉 今天就是蛋糕出场日！";
          return;
        }

        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.textContent = `${days}天 ${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
      }

      update();
      setInterval(update, 1000);
    }

    /* ===== 点击礼盒 ===== */
    function openGift() {
      const box = document.getElementById("giftBox");
      const hint = document.getElementById("giftHint");
      const coupon = document.getElementById("coupon");

      box.style.transform = "scale(1.2) rotate(-8deg)";
      setTimeout(() => {
        box.style.display = "none";
        hint.style.display = "none";
        coupon.classList.add("show");
        generateCode();
        initCakeCountdown();
      }, 300);
    }

    /* ===== 生成券码 ===== */
    function generateCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "LOVE-";
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      code += "-";
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      document.getElementById("couponCode").textContent = "券码 · " + code;
    }

    /* ===== 领取礼物 ===== */
    function claimGift() {
      const btn = document.getElementById("claimBtn");
      const tip = document.getElementById("claimTip");

      btn.textContent = "已领取 💖";
      btn.classList.add("claimed");
      tip.textContent = "礼物已送达，记得查收呀";

      document.getElementById("stat0").textContent = "✅ 已领取";
      document.getElementById("stat1").textContent = "✅ 已领取";
      document.getElementById("stat2").textContent = "✅ 已领取";

      launchConfetti();
    }

    /* ===== 撒花特效 ===== */
    function launchConfetti() {
      const container = document.getElementById("confetti");
      const colors = ["#c9a96e", "#e74c3c", "#f1c40f", "#2ecc71", "#3498db", "#ff8fbf", "#ff6b9d"];
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const p = document.createElement("div");
          p.className = "confetti-piece";
          p.style.left = Math.random() * 100 + "%";
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.animationDuration = Math.random() * 2 + 2 + "s";
          p.style.width = Math.random() * 8 + 6 + "px";
          p.style.height = Math.random() * 12 + 8 + "px";
          container.appendChild(p);
          setTimeout(() => p.remove(), 4000);
        }, i * 40);
      }
    }

    /* ===== 点击礼物词条查看图片 ===== */
    function viewGift(index) {
      const g = GIFTS[index];
      if (!g) return;

      const modal = document.getElementById("giftPhotoModal");
      const img = document.getElementById("giftPhotoImg");
      const hint = document.getElementById("giftPhotoHint");

      img.src = g.img;
      img.style.transform = "scale(1)";
      zoomed = false;
      img.style.cursor = "zoom-in";

      document.getElementById("giftPhotoName").textContent = g.name;
      document.getElementById("giftPhotoDesc").textContent = g.desc;
      document.getElementById("giftPhotoTag").textContent = g.tag;

      modal.classList.add("show");
      hint.style.display = "block";

      // 图片点击只负责放大
      img.onclick = function(e) {
        e.stopPropagation();
        zoomGiftPhoto(img);
      };

      // 🎂 蛋糕词条：点开就放生日快乐歌
      if (g.name.includes("蛋糕")) {
        const audio = document.getElementById("birthdayAudio");
        audio.currentTime = 0;
        audio.volume = 0.6;
        audio.play().catch(() => {});
      }
    }

    function closeGiftPhoto() {
      document.getElementById("giftPhotoModal").classList.remove("show");
      document.getElementById("giftPhotoHint").style.display = "none";
      // 关弹窗停生日歌（不影响背景乐）
      const audio = document.getElementById("birthdayAudio");
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
      }
    }

    function zoomGiftPhoto(img) {
      zoomed = !zoomed;
      img.style.transition = "transform 0.3s";
      img.style.transform = zoomed ? "scale(1.6)" : "scale(1)";
      img.style.cursor = zoomed ? "zoom-out" : "zoom-in";
    }

    document.addEventListener("keydown", e => {
      const m = document.getElementById("giftPhotoModal");
      if (!m.classList.contains("show")) return;
      if (e.key === "Escape") closeGiftPhoto();
    });
  </script>
</body>
</html>
