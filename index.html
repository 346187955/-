<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三周年快乐</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== 四季背景合影层 ===== -->
<div class="bg-photos">
  <div class="bg-photo active" data-season="spring" style="background-image:url('spring.jpg')"></div>
  <div class="bg-photo" data-season="summer" style="background-image:url('summer.jpg')"></div>
  <div class="bg-photo" data-season="autumn" style="background-image:url('autumn.jpg')"></div>
  <div class="bg-photo" data-season="winter" style="background-image:url('winter.jpg')"></div>
</div>
<!-- 顶部日期 -->
<div class="date-badge">2026 · 10 · 13</div>

<!-- 主视觉：教室窗口 -->
 
<div class="window-scene">
  
  <div class="window-frame">
    <div class="sky" id="sky">
      <div class="sky">
  <!-- 远山剪影 -->
  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
  </div>
  <!-- 建筑剪影 -->
  <div class="buildings">
    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
  </div>
  <div class="sun" id="sun"></div>
  ...
      <div class="sun" id="sun"></div>
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
      <div class="snow-layer" id="snowLayer"></div>
    </div>
    <div class="window-sill"></div>
  </div>
  <p class="scene-caption">在教室窗口，我们看了三年风景</p>
</div>

<!-- ===== 主内容区：左侧树 + 右侧内容 ===== -->
<div class="main-flex">

  <!-- 左侧：成长之树 + 长椅 -->
  <div class="tree-section">
    <div class="tree-scene">

      <div class="season-bg" id="seasonBg"></div>

      <!-- 长椅 + 两个人 -->
      <div class="bench-area">
        <div class="bench">
          <div class="bench-seat"></div>
          <div class="bench-back"></div>
          <div class="bench-leg left"></div>
          <div class="bench-leg right"></div>
        </div>
        <!-- 两个人坐着（大头贴） -->
        <div class="couple">
        <div class="avatar avatar-left">
            <img src="me.jpg" alt="我"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
            <div class="avatar-placeholder">我</div>
            <div class="name-tag">Y</div>
        </div>
        <div class="avatar avatar-right">
            <img src="her.jpg" alt="她"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
            <div class="avatar-placeholder">她</div>
            <div class="name-tag">X</div>
        </div>
        </div>
        <!-- 长椅上的话 -->
        <div class="bench-quote">第四个秋天<br/>还想和你一起看</div>
      </div>

      <!-- 地面 -->
      <div class="ground"></div>

      <!-- 树 -->
      <div class="tree" id="tree">
        <div class="trunk"></div>
        <div class="canopy canopy-back"></div>
        <div class="canopy canopy-mid"></div>
        <div class="canopy canopy-front"></div>
<!-- 树木粒子画布 -->
<canvas id="treeParticles" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;"></canvas>
        <!-- 合照相框（会飞） -->
        <div class="photo-frame" id="photoFrame">
          <img src="1.jpg" alt="合照1" id="treePhoto" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
          <div class="photo-placeholder">📷<br/>合照</div>
        </div>

        <div class="particles" id="particles"></div>
        <div class="blossoms" id="blossoms"></div>
      </div>

      <div class="click-hint" id="clickHint">点一下树试试 💕</div>
      <div class="tree-stage" id="stageText">🌱 一颗幼芽</div>

      <!-- 彩蛋提示 -->
      <div class="egg-hint" id="eggHint"></div>

      <!-- 四季切换 -->
      <div class="season-switcher">
      <button class="season-btn active" data-season="spring" onclick="setSeason('spring', this)">🌸</button>
      <button class="season-btn" data-season="summer" onclick="setSeason('summer', this)">🌿</button>
      <button class="season-btn" data-season="autumn" onclick="setSeason('autumn', this)">🍂</button>
      <button class="season-btn" data-season="winter" onclick="setSeason('winter', this)">❄️</button>
      <button class="auto-play-btn" id="autoPlayBtn" onclick="toggleAutoPlay()" title="自动轮播">▶</button>
    <!-- 音乐控制按钮 -->
<button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="背景音乐">
  🎵
</button>
    </div>

    </div>
  </div>

  <!-- 右侧内容 -->
  <div class="right-content">
    <div class="counter">
      <div class="counter-item"><span id="days">1095</span><label>天</label></div>
      <div class="counter-item"><span id="hours">00</span><label>小时</label></div>
      <div class="counter-item"><span id="minutes">00</span><label>分钟</label></div>
      <div class="counter-item"><span id="seconds">00</span><label>秒</label></div>
    </div>
    <div class="main-quote">
      "从教室窗口到未来每一扇窗<br/>我都想和你一起看"
    </div>
  </div>

</div>

<!-- 跳转卡片 -->
<div class="nav-cards">
  <a href="memory.html" class="nav-card"><span class="nav-icon">📸</span><span>我们的回忆</span></a>
  <a href="letter.html" class="nav-card"><span class="nav-icon">💌</span><span>想对你说</span></a>
  <a href="surprise.html" class="nav-card"><span class="nav-icon">🎁</span><span>一个惊喜</span></a>
</div>

<div class="footer"><p>2023 → 2026 · 三年 · 每一天都算数</p></div>

<!-- ===== 照片弹窗 ===== -->
<div class="photo-modal" id="photoModal">
  <div class="photo-modal-bg" onclick="closePhoto()"></div>
  <div class="photo-modal-content" id="photoModalContent">
    <button class="photo-close" onclick="closePhoto()">✕</button>

    <div class="photo-carousel">
      <button class="carousel-btn prev" onclick="prevPhoto()">‹</button>

      <div class="photo-modal-frame" id="modalFrame">
        <img src="1.jpg" id="modalPhoto" onerror="handleModalError()" />
        <div class="photo-modal-placeholder" id="modalPlaceholder">
          <div style="font-size:48px;">📷</div>
        </div>
      </div>

      <button class="carousel-btn next" onclick="nextPhoto()">›</button>
    </div>

    <!-- 照片配文 -->
    <div class="photo-story" id="photoStory"></div>

    <!-- 圆点指示器 -->
    <div class="photo-dots" id="photoDots"></div>
  </div>
</div>

<!-- ===== 隐藏彩蛋弹窗 ===== -->
<div class="egg-modal" id="eggModal">
  <div class="egg-modal-content">
    <div class="egg-title">🎉 你发现了彩蛋！</div>
    <div class="egg-text" id="eggText">
      三年来你每一次点树<br/>
      都在告诉我<br/>
      你有多想和我在一起 💕
    </div>
    <button class="egg-btn" onclick="closeEgg()">我知道了，继续爱你 ❤️</button>
    <div class="egg-hearts" id="eggHearts"></div>
  </div>
</div>

<script src="countdown.js"></script>
<script src="tree.js"></script>
</body>
</html>
